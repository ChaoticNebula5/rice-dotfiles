# kitty: LeyzS see-through + 43PR minimal, colours from the wallpaper (rice-colors.conf)
font_family      Cascadia Code NF
bold_font        auto
italic_font      auto
font_size        11.5

background_opacity    0.72
dynamic_background_opacity yes
window_padding_width  12 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_trail          3
cursor_trail_decay    0.1 0.4

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " {index}: {title} "

scrollback_lines 10000
copy_on_select   no
strip_trailing_spaces smart

# Ctrl+Shift+= / - to change the see-through level live
map ctrl+alt+equal set_background_opacity +0.05
map ctrl+alt+minus set_background_opacity -0.05

include rice-colors.conf
shell /usr/bin/zsh
