# hyprlock: frosted screenshot, big thin clock, one clean password pill
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.2, 0, 0, 1
    animation = fadeIn, 1, 5, soft
    animation = fadeOut, 1, 5, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.01
}

# hours
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $lock_text
    font_size = 150
    font_family = Cascadia Code NF ExtraLight
    position = 0, 250
    halign = center
    valign = center
}

# minutes (accent colour)
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $lock_accent
    font_size = 150
    font_family = Cascadia Code NF ExtraLight
    position = 0, 60
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_dim
    font_size = 15
    font_family = Cascadia Code NF SemiLight
    position = 0, -70
    halign = center
    valign = center
}

# profile picture (rice pfp /path/to/image)
image {
    monitor =
    path = ~/.face
    size = 88
    rounding = -1
    border_size = 2
    border_color = $lock_accent
    position = 0, 175
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $USER
    color = $lock_text
    font_size = 13
    font_family = Cascadia Code NF SemiBold
    position = 0, 140
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $lock_accent
    inner_color = $lock_inner
    font_color = $lock_text
    check_color = $lock_accent2
    fail_color = $lock_fail
    fail_text = <i>try again</i>
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">󰌾  Password</span>
    font_family = Cascadia Code NF
    hide_input = false
    position = 0, 70
    halign = center
    valign = bottom
}

# battery, bottom right
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = $lock_dim
    font_size = 12
    font_family = Cascadia Code NF
    position = -30, 25
    halign = right
    valign = bottom
}
