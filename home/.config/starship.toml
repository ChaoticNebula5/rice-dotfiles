# 43PR's minimal prompt, tinted with the terminal palette (so it follows the wallpaper)
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = """
$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bright-black"
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = " "
style = "bright-black"
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "bright-black"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "bright-black"
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 2000
style = "yellow"
format = '[took $duration]($style) '

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
